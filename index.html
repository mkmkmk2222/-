<body>
  <div class="app">
    <header class="topbar">
      <div class="brand"><span class="brand-mark" aria-hidden="true"></span>나만의 돌림판</div>
      <div class="controls">
        <button id="sound" class="subtle-button icon-button" type="button" aria-label="효과음" aria-pressed="true" title="효과음 켜짐">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><g class="sound-waves"><path d="M15 8a6 6 0 0 1 0 8M18 5a10 10 0 0 1 0 14"/></g><path class="sound-slash" d="m16 9 5 6m0-6-5 6"/></svg>
        </button>
        <button id="settings" class="subtle-button" type="button" aria-haspopup="dialog">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 17h16"/><path d="M8 4v6M16 14v6"/></svg>설정
        </button>
      </div>
    </header>
    <main>
      <h1>오늘의 선택은?</h1>
      <p class="intro">돌림판을 돌려 결정해 보세요.</p>
      <div class="count">선택지 <strong id="count">4개</strong></div>
      <div class="wheel-shell">
        <div class="pointer" id="pointer" aria-hidden="true"><svg viewBox="0 0 28 37"><path d="M3 2H25L14 34Z" fill="#f8fafc" stroke="#303234" stroke-width="2.5" stroke-linejoin="round"/></svg></div>
        <canvas id="wheel" width="1000" height="1000" role="img" aria-label="돌림판"></canvas>
        <div class="hub" aria-hidden="true"><i></i></div>
      </div>
      <button id="spin" class="spin" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 7v5h-5M20 12a8 8 0 1 0-2.3 5.7"/></svg><span id="spin-label">돌리기</span></button>
      <div id="result" class="result" role="status" aria-live="polite" aria-atomic="true"><p class="hint">설정에서 이름을 바꿀 수 있어요.<br>스페이스바로도 돌릴 수 있어요.</p></div>
    </main>
  </div>
  <dialog id="settings-dialog" aria-labelledby="settings-title">
    <form id="settings-form" novalidate>
      <header class="dialog-header"><h2 id="settings-title">돌림판 설정</h2><button id="close-settings" class="close" type="button" aria-label="설정 닫기">×</button></header>
      <div class="settings-body">
        <div>
          <div class="field-head"><label for="names">선택지</label><span id="draft-count" class="meta">4 / 30</span></div>
          <textarea id="names" rows="5" maxlength="4000" spellcheck="false" placeholder="한 줄에 하나씩 입력해 주세요" aria-describedby="names-help"></textarea>
          <p id="names-help" class="help">한 줄에 하나씩, 2~30개까지 입력할 수 있어요.</p>
        </div>
        <div>
          <div class="field-head"><label for="speed">회전 속도</label><span class="meta">기본보다 빠르게</span></div>
          <div class="range-row"><input id="speed" type="range" min="0.75" max="2.5" step="0.25" value="1.5"><output id="speed-value" for="speed">1.5배</output></div>
        </div>
        <div>
          <div class="field-head"><label for="duration">회전 시간</label><span class="meta">서서히 멈춰요</span></div>
          <div class="range-row"><input id="duration" type="range" min="4" max="12" step="1" value="7"><output id="duration-value" for="duration">7초</output></div>
        </div>
        <details>
          <summary>선택 제외 설정</summary>
          <div class="rules">
            <div class="chips"><span class="chip">정환</span><span class="chip">림컴</span></div>
            <p class="help">위 단어가 포함된 항목은 원판에 표시되지만 결과로 선택되지 않아요. 띄어쓰기도 구분하지 않아요.</p>
            <label for="extra-keywords">추가 제외 단어</label>
            <input id="extra-keywords" type="text" maxlength="500" placeholder="예: 민수, 지훈" aria-describedby="keywords-help">
            <p id="keywords-help" class="help">여러 단어는 쉼표로 구분해 주세요.</p>
          </div>
        </details>
        <p id="form-error" class="form-error" role="alert" hidden></p>
      </div>
      <footer class="dialog-footer"><button id="cancel-settings" class="subtle-button" type="button">취소</button><button class="apply" type="submit">설정 적용</button></footer>
    </form>
  </dialog>
  <script id="wheel-core">
  (() => {
    'use strict';
    const TAU = Math.PI * 2;
    const mandatory = Object.freeze(['정환', '림컴']);
    const normalize = text => String(text).normalize('NFKC').replace(/[\s\u200B-\u200F\u202A-\u202E\u2060-\u206F\uFEFF]/gu, '').toLocaleLowerCase('ko');
    const modulo = value => ((value % TAU) + TAU) % TAU;
    const parseNames = text => String(text).split(/\r?\n/).map(s => s.trim()).filter(s => normalize(s).length > 0);
    const keywords = extra => [...mandatory, ...String(extra).split(/[,，\n]/)].map(normalize).filter(Boolean);
    const eligible = (names, extra = '') => {
      const blocked = keywords(extra);
      return names.map((name, index) => ({ name, index })).filter(item => !blocked.some(word => normalize(item.name).includes(word)));
    };
    function random() {
      if (!globalThis.crypto?.getRandomValues) return Math.random();
      return globalThis.crypto.getRandomValues(new Uint32Array(1))[0] / 4294967296;
    }
    function randomIndex(length) {
      if (!Number.isInteger(length) || length < 1) throw new Error('선택 가능한 항목이 없어요.');
      if (!globalThis.crypto?.getRandomValues) return Math.floor(Math.random() * length);
      const limit = Math.floor(4294967296 / length) * length;
      let sample;
      do { sample = globalThis.crypto.getRandomValues(new Uint32Array(1))[0]; } while (sample >= limit);
      return sample % length;
    }
    function planSpin(names, extra, current, seconds, speed = 1.5) {
      const candidates = eligible(names, extra);
      if (!candidates.length) throw new Error('선택 가능한 항목이 없어요. 설정에서 다른 이름을 추가해 주세요.');
      const selected = candidates[randomIndex(candidates.length)];
      // The landing point stays well inside the selected segment, never on a border.
      const offset = .20 + random() * .60;
      const target = modulo(-(selected.index + offset) * TAU / names.length);
      const travel = Math.ceil((7 + randomIndex(4)) * speed) * TAU + modulo(target - modulo(current));
      return Object.freeze({ index:selected.index, name:selected.name, start:current, end:current + travel, duration:seconds * 1000 * (.96 + random() * .08) });
    }
    function progress(t) {
      t = Math.min(1, Math.max(0, t));
      // Integral of a smooth acceleration followed by a cubic velocity decay.
      // Velocity and acceleration are zero at both ends; no last-frame correction.
      const a = .12, total = a / 2 + (1 - a) * 16 / 35;
      if (t <= a) { const u = t/a; return a * (u*u*u - .5*u*u*u*u) / total; }
      const u = (t-a)/(1-a);
      return (a/2 + (1-a) * (u - u**3 + 3*u**5/5 - u**7/7)) / total;
    }
    const indexAt = (angle, length) => Math.min(length - 1, Math.floor(modulo(-angle) / TAU * length));
    globalThis.WheelMath = Object.freeze({ TAU, mandatory, normalize, parseNames, eligible, randomIndex, planSpin, progress, indexAt, modulo });
  })();
  </script>
  <script id="wheel-app">
  (() => {
    'use strict';
    const $ = id => document.getElementById(id);
    const math = globalThis.WheelMath;
    const canvas = $('wheel'), context = canvas.getContext('2d');
    const dialog = $('settings-dialog');
    const palette = ['#f3e875','#8de67f','#79dfeb','#ed8084','#c6a4ef','#f3b678','#87aeee','#ed9dca','#b3db87','#8dd5ba'];
    let config = { names:['정환','민수','림컴','지훈'], extra:'', seconds:7, speed:1.5 };
    let angle = 0, spinning = false, sound = true, audioContext = null, lastTickTime = 0, lastWinner = null;

    function textLine(label, limit) {
      const chars = Array.from(label);
      while (chars.length && context.measureText(chars.join('')).width > limit) chars.pop();
      if (chars.length < Array.from(label).length) { while (chars.length && context.measureText(chars.join('') + '…').width > limit) chars.pop(); return chars.join('') + '…'; }
      return label;
    }
    function drawWheel() {
      const size = canvas.width, r = size / 2 - 3, step = math.TAU / config.names.length;
      context.clearRect(0,0,size,size);
      for (let i = 0; i < config.names.length; i++) {
        const start = -Math.PI/2 + i*step, mid = start + step/2;
        context.beginPath(); context.moveTo(size/2,size/2); context.arc(size/2,size/2,r,start,start+step); context.closePath();
        context.fillStyle = palette[i % palette.length]; context.fill();
        context.strokeStyle = '#30323499'; context.lineWidth = 2.5; context.stroke();
        context.save(); context.translate(size/2,size/2); context.rotate(mid);
        context.font = '750 ' + (config.names.length <= 8 ? 41 : config.names.length <= 16 ? 33 : 25) + 'px "Malgun Gothic", system-ui, sans-serif';
        context.fillStyle = '#20262b'; context.textBaseline = 'middle';
        if (config.names.length <= 8) {
          context.translate(r*.62,0); context.rotate(-mid); context.textAlign = 'center';
          const available = Math.min(300, 2*r*.62*Math.sin(step/2)*.80);
          context.fillText(textLine(config.names[i],available),0,0);
        } else {
          context.textAlign = 'right'; context.fillText(textLine(config.names[i],r*.63),r*.90,0);
        }
        context.restore();
      }
      canvas.setAttribute('aria-label', '돌림판 선택지: ' + config.names.join(', '));
      $('count').textContent = config.names.length + '개';
    }
    function hint(message, error = false) {
      $('result').className = 'result' + (error ? ' error' : '');
      const p = document.createElement('p'); p.className = 'hint'; p.textContent = message;
      $('result').replaceChildren(p);
    }
    function showWinner(name) {
      $('result').className = 'result has-winner';
      const label = document.createElement('span'); label.className='winner-label'; label.textContent='선택된 항목';
      const winner = document.createElement('strong'); winner.className='winner'; winner.textContent=name;
      $('result').replaceChildren(label,winner);
    }
    function tone(frequency, duration, volume = .055, delay = 0) {
      if (!sound || !audioContext || audioContext.state !== 'running') return;
      try {
        const now = audioContext.currentTime + delay, oscillator = audioContext.createOscillator(), gain = audioContext.createGain();
        oscillator.type='sine'; oscillator.frequency.setValueAtTime(frequency,now);
        gain.gain.setValueAtTime(0,now); gain.gain.linearRampToValueAtTime(volume,now+.003); gain.gain.exponentialRampToValueAtTime(.0001,now+duration);
        oscillator.connect(gain); gain.connect(audioContext.destination); oscillator.start(now); oscillator.stop(now+duration+.02);
        oscillator.onended=()=>{ oscillator.disconnect(); gain.disconnect(); };
      } catch { /* Sound is optional and must never prevent a spin. */ }
    }
    function initSound() {
      try { const Audio = window.AudioContext || window.webkitAudioContext; if (sound && Audio) { audioContext ||= new Audio(); audioContext.resume().catch(()=>{}); } } catch { /* Continue silently. */ }
    }
    function openSettings() {
      if (spinning) return;
      $('names').value = config.names.join('\n'); $('extra-keywords').value=config.extra; $('duration').value=config.seconds;
      $('duration-value').textContent=config.seconds+'초'; $('form-error').hidden=true; updateDraftCount(); dialog.showModal();
      $('speed').value=config.speed; $('speed-value').textContent=config.speed+'배';
    }
    function validateConfig(names, extra, seconds, speed) {
      if (names.length < 2 || names.length > 30) throw new Error('선택지는 2개 이상, 30개 이하로 입력해 주세요.');
      if (names.some(name => Array.from(name).length > 80)) throw new Error('각 항목은 80자 이하로 입력해 주세요.');
      if (!Number.isInteger(seconds) || seconds < 4 || seconds > 12) throw new Error('회전 시간은 4~12초로 설정해 주세요.');
      if (typeof speed !== 'number' || !Number.isFinite(speed) || speed < .75 || speed > 2.5 || !Number.isInteger(speed*4)) throw new Error('회전 속도는 0.75~2.5배로 설정해 주세요.');
      if (extra.length > 500) throw new Error('추가 제외 단어는 500자 이하로 입력해 주세요.');
      if (!math.eligible(names,extra).length) throw new Error('모든 항목이 제외 대상이에요. 선택 가능한 이름을 하나 이상 추가해 주세요.');
    }
    function applyConfig(next) {
      if (spinning) throw new Error('회전이 끝난 뒤 설정할 수 있어요.');
      validateConfig(next.names,next.extra,next.seconds,next.speed);
      config={ names:[...next.names],extra:next.extra,seconds:next.seconds,speed:next.speed }; angle=0; lastWinner=null;
      canvas.style.transform='rotate(0rad)'; drawWheel(); hint('설정이 적용됐어요. 준비되면 돌려 보세요.');
    }
    function updateDraftCount() { $('draft-count').textContent=math.parseNames($('names').value).length+' / 30'; }
    function spin() {
      if (spinning || dialog.open) return Promise.reject(new Error('진행 중인 회전이나 설정을 먼저 마쳐 주세요.'));
      let plan;
      try { plan=math.planSpin(config.names,config.extra,angle,config.seconds,config.speed); }
      catch(error) { hint(error.message,true); return Promise.reject(error); }
      spinning=true; $('spin').disabled=true; $('settings').disabled=true; $('spin-label').textContent='돌아가는 중'; lastWinner=null;
      hint('어떤 항목이 선택될까요?'); initSound();
      const start=performance.now(), reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const totalTime=reduced ? 900 : plan.duration;
      let previousSegment=math.indexAt(angle,config.names.length);
      return new Promise(resolve => {
        function frame(now) {
          const t=Math.min(1,(now-start)/totalTime), value=math.progress(t);
          angle=plan.start+(plan.end-plan.start)*value;
          if (!reduced) canvas.style.transform='rotate('+angle+'rad)';
          const segment=math.indexAt(angle,config.names.length);
          if (!reduced && segment!==previousSegment && now-lastTickTime>55) { tone(1150,.024,.045); lastTickTime=now; }
          previousSegment=segment;
          if (t<1) { requestAnimationFrame(frame); return; }
          // Normalize only whole turns: the wheel does not jump to another result.
          angle=math.modulo(plan.end); canvas.style.transform='rotate('+angle+'rad)';
          spinning=false; lastWinner=plan.name; $('spin').disabled=false; $('settings').disabled=false; $('spin-label').textContent='다시 돌리기';
          showWinner(plan.name); tone(660,.18,.045); tone(880,.3,.045,.12);
          resolve({ name:plan.name,index:plan.index });
        }
        requestAnimationFrame(frame);
      });
    }
    $('settings').addEventListener('click',openSettings);
    ['close-settings','cancel-settings'].forEach(id=>$(id).addEventListener('click',()=>dialog.close()));
    dialog.addEventListener('click',event=>{ if(event.target===dialog) { const b=dialog.getBoundingClientRect(); if(event.clientX<b.left || event.clientX>b.right || event.clientY<b.top || event.clientY>b.bottom) dialog.close(); } });
    $('names').addEventListener('input',updateDraftCount);
    $('duration').addEventListener('input',()=>$('duration-value').textContent=$('duration').value+'초');
    $('speed').addEventListener('input',()=>$('speed-value').textContent=$('speed').value+'배');
    $('settings-form').addEventListener('submit',event=>{
      event.preventDefault();
      try { applyConfig({names:math.parseNames($('names').value),extra:$('extra-keywords').value,seconds:Number($('duration').value),speed:Number($('speed').value)}); dialog.close(); }
      catch(error) { $('form-error').textContent=error.message; $('form-error').hidden=false; }
    });
    $('spin').addEventListener('click',()=>void spin().catch(()=>{}));
    $('sound').addEventListener('click',()=>{ sound=!sound; $('sound').setAttribute('aria-pressed',String(sound)); $('sound').title=sound?'효과음 켜짐':'효과음 꺼짐'; });
    document.addEventListener('keydown',event=>{
      if(event.code==='Space' && !event.repeat && !event.altKey && !event.ctrlKey && !event.metaKey && !dialog.open && !spinning && !event.target.closest('input,textarea,select,button,summary,[contenteditable="true"]')) { event.preventDefault(); void spin().catch(()=>{}); }
    });
    drawWheel();

    // Optional browser-agent integration shares the UI's validation and actions.
    if(document.modelContext?.registerTool) {
      const lifecycle=new AbortController();
      const register=tool=>{try { Promise.resolve(document.modelContext.registerTool(tool,{signal:lifecycle.signal})).catch(()=>{}); } catch { /* Unsupported implementations do not affect the UI. */ }};
      register({ name:'read_wheel',description:'현재 돌림판의 항목, 제외 단어, 회전 상태와 마지막 결과를 읽습니다.',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:true,untrustedContentHint:true},execute:()=>({names:[...config.names],excludedKeywords:[...math.mandatory],additionalExcludedKeywords:config.extra,seconds:config.seconds,speed:config.speed,spinning,winner:lastWinner}) });
      register({ name:'configure_wheel',description:'돌림판의 이름, 추가 제외 단어, 회전 속도와 시간을 변경합니다. 정환과 림컴은 항상 제외됩니다.',inputSchema:{type:'object',properties:{names:{type:'array',minItems:2,maxItems:30,items:{type:'string',minLength:1,maxLength:80}},additionalExcludedKeywords:{type:'string',maxLength:500},seconds:{type:'integer',minimum:4,maximum:12},speed:{type:'number',minimum:.75,maximum:2.5,multipleOf:.25}},required:['names'],additionalProperties:false},annotations:{readOnlyHint:false,untrustedContentHint:true},execute:input=>{
        if(!input || !Array.isArray(input.names) || input.names.some(n=>typeof n!=='string' || !math.normalize(n) || /[\r\n]/.test(n))) throw new Error('각 선택지를 비어 있지 않은 한 줄의 문자열로 입력해 주세요.');
        if(input.additionalExcludedKeywords!==undefined && typeof input.additionalExcludedKeywords!=='string') throw new Error('추가 제외 단어는 문자열이어야 합니다.');
        const next={names:input.names.map(n=>n.trim()),extra:input.additionalExcludedKeywords??config.extra,seconds:input.seconds??config.seconds,speed:input.speed??config.speed};
        applyConfig(next); if(dialog.open) dialog.close(); return {names:[...config.names],seconds:config.seconds,speed:config.speed};
      }});
      register({ name:'spin_wheel',description:'현재 설정으로 돌림판을 돌리고 애니메이션이 끝난 뒤 선택 결과를 반환합니다.',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:false,untrustedContentHint:true},execute:()=>spin() });
      window.addEventListener('pagehide',()=>lifecycle.abort(),{once:true});
    }
  })();
  </script>
</body>
</html>
